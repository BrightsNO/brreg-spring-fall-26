# Demo D2 og oppgave 4.1: viser hva Spring Security gjør for hver forespørsel.
# Start med --spring.profiles.active=trace
logging:
  level:
    org.springframework.security: TRACE
# Bare demo D2: en kjent innlogging for standardbrukeren (generert). Ignoreres så snart vi definerer egne brukere.
spring:
  security:
    user:
      name: user
      password: password
      roles: USER
