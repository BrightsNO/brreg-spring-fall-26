spring:
  application:
    name: company-session6
  security:
    oauth2:
      resourceserver:
        jwt:
          # Oppgave 6.3: Spring Boot leser http://localhost:9000/.well-known/openid-configuration, finner nøklene
          # (jwks_uri) og sjekker signatur, utløp og utsteder på hvert token.
          issuer-uri: http://localhost:9000
          # Oppgave 6.6 a: bare tokens laget for dette API-et (claimet aud)
          audiences: company-api
management:
  endpoints:
    web:
      exposure:
        include: health,mappings
